<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Brawl Arena — 3v3 Gem Grab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud-layer" class="layer hidden"></div>
      <div id="controls-layer" class="layer hidden"></div>
      <div id="ui-layer" class="layer"></div>
      <div id="toast-layer" class="toast-layer"></div>
      <div id="portrait-blocker" class="portrait-blocker hidden">
        <div class="portrait-card">
          <div class="portrait-icon">📱↻</div>
          <h2>Rotate device to landscape to play</h2>
          <p>Brawl Arena uses dual-stick landscape controls.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
